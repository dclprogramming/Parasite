name: Build Parasite APK

# Builds the single "stfdroid" flavor (no Firebase, no updater) and signs it with YOUR key from
# repository secrets. Push to main = test build artifact. Push a tag like v1.0.0 = GitHub Release.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # only used by the tag-release step
    timeout-minutes: 60
    steps:
      # Actions are pinned to commit SHAs, not moving tags (a compromised tag can't change what runs).
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper (checks gradle-wrapper.jar against Gradle's official checksums)
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 11
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Install Android SDK pieces
        # sdkmanager itself needs Java 17+, while the app build needs Java 11, so run it with the
        # runner's preinstalled JDK 17 and leave JAVA_HOME (JDK 11) untouched for Gradle.
        run: |
          set -e
          JDK17="${JAVA_HOME_17_X64:-}"
          test -n "$JDK17" || { echo "::error::JDK 17 not found on runner"; exit 1; }
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | JAVA_HOME="$JDK17" "$SDKM" --licenses > /dev/null || true
          JAVA_HOME="$JDK17" "$SDKM" "platforms;android-34" "build-tools;30.0.3" "ndk;21.0.6113669"

      - name: Write signing config from secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing signing secrets. Run tools/make_keystore.sh on your PC and add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS (see README)."
            exit 1
          fi
          # Tolerate stray spaces/newlines from copy-paste, then prove the result is a usable keystore.
          if ! printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Re-create it with: base64 -w0 parasite-release.jks  (paste only that one line of output)."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore decoded, but the password or alias secret does not match it (alias must be: parasite)."
            exit 1
          fi
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KS_PASS"
          } > keystore.properties

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace :smarttubetv:assembleStfdroidRelease

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Locate APK
        id: apk
        run: |
          APK=$(find smarttubetv/build/outputs/apk -name '*.apk' | head -n1)
          test -n "$APK" || { echo "::error::No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "$APK"

      - name: Verify APK (permissions, native libs, hosts, malware indicators)
        run: python3 tools/verify_apk.py "${{ steps.apk.outputs.path }}"

      - name: Checksum
        run: |
          cd "$(dirname "${{ steps.apk.outputs.path }}")"
          sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parasite-apk
          path: |
            smarttubetv/build/outputs/apk/**/*.apk
            smarttubetv/build/outputs/apk/**/SHA256SUMS.txt
            smarttubetv/build/outputs/apk/**/*.report.txt
          if-no-files-found: error

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D="$(dirname "${{ steps.apk.outputs.path }}")"
          gh release create "${{ github.ref_name }}" "$D"/*.apk "$D"/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --title "Parasite ${{ github.ref_name }}" --generate-notes
